name: CI AI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  quality:
    name: Toolchain + Lint + Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install uv==0.12.5

      - name: Validate pinned toolchain
        shell: pwsh
        run: ./scripts/check-toolchain.ps1

      - name: Sync locked environment
        run: uv sync --locked --no-build --all-groups

      - name: Lint
        run: uv run --locked --no-build ruff check .

      - name: Acquire verified EfficientDet-Lite0
        run: uv run --locked --no-build python -m eyes_project_ai.acquire_model

      - name: Inspect executable model contract
        run: uv run --locked --no-build python -m eyes_project_ai.inspect_model

      - name: Test
        run: uv run --locked --no-build pytest --junitxml=artifacts/ci/tests.xml

      - name: Record model smoke and synthetic host timing
        run: uv run --locked --no-build python -m eyes_project_ai.ci_report

      - name: Store traceable reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eyes-ai-checks-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/ci/
          if-no-files-found: error
          retention-days: 14
